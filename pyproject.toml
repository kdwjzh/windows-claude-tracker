[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "usage-monitor"
dynamic = ["version"]
description = "Windows 浮動小工具：顯示 Claude／Codex 訂閱用量"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "truststore>=0.9",
    "cryptography>=43",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff==0.17.3",  # 與 .pre-commit-config.yaml 的 rev 一致
    "pyright>=1.1.390",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "pyinstaller>=6.11",
]

[project.scripts]
usage-monitor-diagnose = "usage_monitor.diagnose:main"

[tool.hatch.version]
path = "src/usage_monitor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/usage_monitor"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PTH"]
# RUF001–003：繁體中文本來就用全形標點，不是誤植
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["usage_monitor", "fakes", "desktop_fixtures"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
strict = [
    "src/usage_monitor/core",
    "src/usage_monitor/providers",
    "src/usage_monitor/services",
]
extraPaths = ["src", "tests"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not live", "--strict-markers"]
markers = [
    "windows: 需要真 Windows（DPAPI、登錄檔、快捷鍵…）",
    "live: 需要真實登入與網路，預設跳過",
    "qt: 需要建立 Qt 視窗（pytest-qt）",
]

[tool.coverage.run]
branch = true
# 覆蓋率門檻只算 core＋providers＋services（CLAUDE.md §5.3）
omit = [
    "*/usage_monitor/ui/*",
    "*/usage_monitor/platform/*",
    "*/usage_monitor/bootstrap.py",
    "*/usage_monitor/__main__.py",
    "*/usage_monitor/diagnose.py",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "usage_monitor"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "分層：上層可依賴下層，下層不可依賴上層"
type = "layers"
layers = [
    "usage_monitor.__main__",
    "usage_monitor.bootstrap",
    "usage_monitor.ui | usage_monitor.diagnose",
    "usage_monitor.services",
    "usage_monitor.providers",
    "usage_monitor.platform",
    "usage_monitor.core",
]

[[tool.importlinter.contracts]]
name = "core 是純邏輯：不碰 Qt、網路、ctypes、登錄檔"
type = "forbidden"
source_modules = ["usage_monitor.core"]
forbidden_modules = ["PySide6", "requests", "truststore", "cryptography", "ctypes", "winreg"]

[[tool.importlinter.contracts]]
name = "providers／services 不碰 Qt"
type = "forbidden"
source_modules = ["usage_monitor.providers", "usage_monitor.services"]
forbidden_modules = ["PySide6"]

[[tool.importlinter.contracts]]
name = "ui 只透過 ViewModel 拿資料，不直接碰 providers 與 HTTP"
type = "forbidden"
source_modules = ["usage_monitor.ui"]
forbidden_modules = ["usage_monitor.providers", "usage_monitor.platform.http", "requests"]

[[tool.importlinter.contracts]]
name = "各服務互不依賴"
type = "independence"
modules = ["usage_monitor.providers.claude", "usage_monitor.providers.codex"]
