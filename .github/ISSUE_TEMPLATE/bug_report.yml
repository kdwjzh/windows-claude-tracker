name: Bug report
description: Something doesn't work or shows wrong numbers
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **never paste tokens, `.credentials.json`, `auth.json` or `config.json` contents**. The diagnostics output below already masks tokens, so it's safe to paste.
        Found a security problem? Don't open a public issue; see [SECURITY.md](https://github.com/kdwjzh/windows-claude-tracker/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About, for example `v1.3.0`
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver`, for example `Windows 11 24H2 (26100.2033)`
    validations:
      required: true
  - type: dropdown
    id: claude-desktop
    attributes:
      label: How is Claude Desktop installed?
      options:
        - Microsoft Store
        - Regular installer (claude.ai/download)
        - Not installed (Claude Code CLI only)
        - Not using Claude (Codex only)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, what you saw instead, and how to make it happen again
    validations:
      required: true
  - type: textarea
    id: diagnose
    attributes:
      label: Diagnostics output
      description: Settings → Advanced → "Run diagnostics" (or run `diagnose-vX.Y.Z.exe`), then paste the whole output. It follows the app language (English or Traditional Chinese); either is fine
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt (optional)
      description: Relevant lines from `%APPDATA%\MyUsageMonitor\monitor.log` (tokens are already masked)
      render: text
